<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ministry Planner</title>
<link id="favicon" rel="icon" href="">
<style>
  :root{--navy:#1b2a4a;--gold:#f2b705;--blue:#2f80ed;--green:#16a34a;--green-dark:#166534;--green-soft:#eaf5ee;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f7f8fa}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;max-width:560px;margin:0 auto;padding:0 16px;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-tap-highlight-color:transparent}
  #app.hasnav{padding-bottom:92px}
  h1{font-size:22px;margin:0;letter-spacing:-.01em}
  .pagetitle{font-family:Georgia,"Times New Roman",serif;font-size:30px;margin:20px 4px 4px}
  .sub{color:var(--muted);font-size:13px;margin:6px 0 12px}
  .label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 1px 2px rgba(16,24,40,.05)}
  label{display:block;font-size:13px;font-weight:600;color:#374151;margin:14px 0 5px}
  input,select{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;box-sizing:border-box;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,128,237,.15)}
  button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:600;margin-top:12px;cursor:pointer;transition:background .15s ease,transform .1s ease,box-shadow .15s ease}
  button:active{opacity:.92;transform:scale(.98)}
  .navbtn:active{transform:none}
  button.ghost{background:#fff;color:var(--ink);border:1px solid #d1d5db}
  button.green{background:var(--green)}
  button.small{width:auto;padding:8px 14px;font-size:14px;margin:6px 6px 0 0}
  .err{color:#b91c1c;font-size:14px;min-height:18px}
  .pill{display:inline-block;background:var(--green-soft);color:var(--green-dark);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;margin:2px 4px 2px 0}
  .badge{display:inline-block;background:#dcfce7;color:var(--green-dark);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
  .rolebadge{display:inline-block;background:#eef2f7;color:#334155;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
  .terrtag{display:inline-flex;align-items:center;gap:4px;background:#eef2f7;color:#334155;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
  .you{outline:2px solid var(--green);outline-offset:-2px}
  .topbar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;background:var(--navy);margin:0 -16px;padding:12px 16px;box-shadow:0 2px 10px rgba(15,23,42,.25)}
  .brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:18px;font-weight:700;letter-spacing:-.01em}
  .brandicon{width:36px;height:36px;border-radius:10px;display:block}
  .avatarbtn{width:auto;margin:0;padding:0;background:transparent;border:0;border-radius:999px}
  .avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:700;color:#1e293b;flex:none;background-size:cover;background-position:center}
  .bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:var(--navy);z-index:30;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(15,23,42,.25);border-top:1px solid rgba(255,255,255,.08)}
  .navinner{display:flex}
  .navbtn{flex:1;background:transparent;color:#8a94a6;border:0;border-radius:0;margin:0;padding:10px 0 9px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
  .navbtn.on{color:var(--gold)}
  .monthhead{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px}
  .monthhead h2{font-family:Georgia,"Times New Roman",serif;font-size:20px;margin:0}
  .monthnav{display:flex;gap:8px}
  .monthnav button,.daynavbtn{width:38px;height:38px;margin:0;padding:0;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink);font-size:18px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .monthnav button:disabled,.daynavbtn:disabled{opacity:.35}
  .weekrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .weekrow span{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
  .monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cell{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 5px;min-height:120px;cursor:pointer;transition:background .15s ease,transform .1s ease}
  .cell:active{transform:scale(.97)}
  .cell.dim{background:transparent;border-color:transparent}
  .cell.past{opacity:.45}
  .person.past{opacity:.45}
  .cell.today{outline:2px solid #3b82f6;outline-offset:-2px}
  .cell.sel{background:#eaf2fe}
  .dnum{font-size:13px;font-weight:700;text-align:center}
  .arow{display:flex;align-items:center;justify-content:center;gap:5px;background:#eef2f7;color:#334155;border-radius:7px;padding:3px 2px;margin-top:4px;font-size:12px;font-weight:700}
  .arow.in{background:var(--green);color:#fff}
  .arow.empty{opacity:.5}
  .arow svg{flex:none}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:12px 2px 0;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .daynav{display:flex;align-items:center;gap:10px;margin:14px 2px 4px}
  .daynav .datelabel{font-family:Georgia,"Times New Roman",serif;font-size:20px;font-weight:700;flex:1;text-align:center}
  .todaypill{width:auto;margin:0;padding:7px 14px;border-radius:999px;font-size:13px}
  .secthead{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .person{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #f0f0f0;cursor:pointer;transition:background .15s ease}
  .person:active{background:#f7f8fa}
  .person:first-of-type{border-top:0}
  .pinfo{flex:1;min-width:0}
  .pname{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
  .psub{font-size:13px;color:var(--muted)}
  .chev{color:#9ca3af;display:flex;align-items:center}
  .slothead{display:flex;justify-content:space-between;align-items:center}
  .slottime{font-size:18px;font-weight:700}
  .menugrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
  .menucard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;font-size:16px;font-weight:600;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.05);transition:transform .1s ease,box-shadow .15s ease}
  .menucard:active{transform:scale(.98)}
  .menucard.wide{grid-column:1/-1}
  .menuicon{color:var(--blue);flex:none;display:flex}
  .profilehead{display:flex;align-items:center;gap:14px}
  .pname-big{font-size:19px;font-weight:700}
  .dayrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid #f0f0f0;cursor:pointer}
  .dayrow:first-of-type{border-top:0}
  .dayrow .c{color:var(--muted);font-size:13px}
  .infobox{font-size:13px;color:#374151;background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
  .footer{font-size:12px;color:#9ca3af;text-align:center;margin:18px 0 4px}
  .dot-in{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--green);margin-right:5px;vertical-align:-1px}
  .loginbrand{display:flex;flex-direction:column;align-items:center;text-align:center;margin:28px 0 8px}
  .loginbrand img{width:96px;height:96px;border-radius:24px;box-shadow:0 4px 14px rgba(16,24,40,.18)}
  .optbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 10px;color:var(--ink)}
  .optbtn span{flex:1}
  .optbtn b{display:block;font-size:16px}
  .optbtn i{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:2px}
  .optbtn:active{transform:scale(.98)}
  .codebox{display:flex;align-items:center;gap:10px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
  .codebox span{flex:1;min-width:0;font-size:14px;color:var(--muted)}
  .codebox b{font-size:17px;letter-spacing:1px;white-space:nowrap}
  .codebox button{flex:none;width:auto;padding:8px 12px;font-size:14px;margin:0;border-radius:8px}
  .photopick{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
  .filehidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
  label.ghost{display:inline-block;background:#fff;color:var(--ink);border:1px solid #d1d5db;border-radius:10px;padding:13px;font-size:16px;font-weight:600;margin-top:12px;cursor:pointer;text-align:center}
  label.ghost.small{width:auto;padding:8px 14px;font-size:14px;margin:6px 6px 0 0}
  .loginbrand h1{font-family:Georgia,"Times New Roman",serif;font-size:26px;margin:14px 0 2px}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  @keyframes slideUp{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .view.anim{animation:fadeIn .25s ease}
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
  .modal{width:100%;max-width:560px;background:#fff;border-radius:20px 20px 0 0;padding:22px 18px 28px;text-align:center;position:relative;animation:slideUp .25s ease}
  .modal .x{position:absolute;top:12px;right:12px;width:34px;height:34px;margin:0;padding:0;border-radius:999px;background:#f1f5f9;color:#334155;font-size:16px;display:flex;align-items:center;justify-content:center}
  .sheet{width:100%;max-width:560px;background:#fff;border-radius:20px 20px 0 0;padding:18px 18px 26px;position:relative;animation:slideUp .25s ease;max-height:86vh;overflow-y:auto;text-align:left}
  .sheet .x{position:absolute;top:12px;right:12px;width:34px;height:34px;margin:0;padding:0;border-radius:999px;background:#f1f5f9;color:#334155;font-size:16px;display:flex;align-items:center;justify-content:center}
  .joinbtn{width:auto;margin:0;padding:9px 18px;border-radius:999px;font-size:14px}
  .joinbtn.in{background:var(--green)}
  .joinbtn.ghost{background:#fff;color:var(--ink);border:1px solid #d1d5db}
  .pickrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .pickchip{width:auto;margin:0;padding:9px 12px;border-radius:999px;font-size:13px;background:#fff;color:var(--ink);border:1px solid #d1d5db;display:inline-flex;align-items:center;gap:6px}
  .pickchip.on{background:var(--green);color:#fff;border-color:var(--green)}
  .chatlist{margin-top:6px}
  .chatmsg{display:flex;gap:10px;padding:9px 0;border-top:1px solid #f0f0f0}
  .chatlist .chatmsg:first-child{border-top:0}
  .chatbody{flex:1;min-width:0}
  .chatmeta{font-size:13px;font-weight:700}
  .chatmeta span{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
  .chattext{font-size:15px;margin-top:2px;overflow-wrap:anywhere}
  .mention{color:var(--blue);font-weight:700;cursor:pointer}
  .chatinput{display:flex;gap:8px;margin-top:12px}
  .chatinput input{flex:1;margin:0}
  .atbtn{width:auto;margin:0;padding:0 13px;border-radius:999px;font-size:16px;font-weight:700}
  .sendbtn{width:auto;margin:0;padding:0 14px;border-radius:999px;font-size:14px}
  .mentionrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px}
  .menchip{width:auto;margin:0;padding:7px 12px;border-radius:999px;font-size:13px;background:#eef2f7;color:var(--ink);border:1px solid #d1d5db}
  .modalname{font-size:19px;font-weight:700;margin-top:10px}
  .modalphone{font-size:15px;color:var(--muted);margin:4px 0 14px}
  .action{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:0;border-top:1px solid #f0f0f0;border-radius:0;margin:0;padding:14px 6px;color:var(--ink);font-size:16px;font-weight:500;text-decoration:none;cursor:pointer}
</style>
</head>

<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* Ministry Planner — synced version (Firebase/Firestore backend).
   Brand restored to "Ministry Planner" Nov 26, 2026 (MP is only the acronym).
   Renamed Nov 23, 2026 (was "Service Roll Call"). Lighthouse-style redesign:
   dark navy top bar + bottom nav (My Schedule / Daily / More), month calendar
   as the main view, Daily view with conductor + time + what friends are doing,
   More menu (My Schedule, Daily view, Profile, Settings, Help), contact popup
   (Call / Text / Copy phone — no email), profile with photo + phone (no email),
   territory map icon next to names that have territory.
   Polished Nov 23 ("smooth it out"): view fade on navigation, bottom-sheet
   popup animation, press feedback on buttons/cards/cells, SVG chevrons,
   scroll position kept on in-place updates (mark/save/popup) while navigation
   scrolls to top.
   Nov 23 evening — day popup + activity icons + back in time + multi-activity + day chat:
   Calendar cells show one little row per activity with people signed up (door/mail/phone/book/cart icons; green row = you're in that one).
   Tapping a day opens a day popup (like Lighthouse On Deck): conductor, 9:30/After meeting, who's going, Join to add yourself, day chat below.
   Past months and days are viewable (read-only). One person can sign up for
   several activities the same day (carts, then door to door). Day chat per day:
   messages with @mentions (tap a mention for their contact card) to make plans.
   Fixed in the same pass: signupsFor was reading the conductor from the wrong
   place, so the conductor name never showed — it now reads data[k+"_conductor"].
   Settled rules from Cayden:
   - Fixed times: 9:30 AM every morning; after the Sunday meeting on Sundays.
   - Four activities only: Door to door, Letters, Calls/Returns, Study.
     No carts, no harbor (those already have systems).
   - No email, no passwords. Login = congregation code + publisher code.
   - Once signed in, you stay signed in (session saved on this device).
   - Setup & roles (settled Nov 22): ONE elder — whoever it is — sets up the
     congregation and manages roles from there. Roles: Manager (the elder who
     set it up — manages roles, rotates the code), Conductor (sets the day's
     conductor in the Scheduler), Publisher (marks themselves in, sees the board).
     No separate elder code.
   - D1 SETTLED (Nov 23): sign-ups open as far ahead as the conductor
     schedule is known — the board lists days from today through the last day
     with a conductor set (no fixed cap). Past days drop off at midnight (12:00 AM) and today is highlighted.
   Demo: "Try the demo" makes your own publisher account in the Dickinson Congregation demo (code DEMO, fresh 9-char code + profile step) — nobody logs in as Cayden. The demo's Manager account is seeded with a generated code stored only in Firestore, and no phone number is in this file.
   Emptied Nov 23 for testing: the demo starts with just Cayden — no seeded
   conductors, sign-ups, or territory. Add publishers in Settings (Manager).
   All data lives in one Firestore document per congregation (collection "congregations", document ID = the congregation code),
   so one congregation can never see another's list.   Third round same evening (Lighthouse reference screenshots): Arrived check-in for today — removed Nov 24 at Cayden's request (green Arrived button + Arrived/Accepted tags in the day list; v6 migration drops the stored k+"_arrived" data).
  Fourth round same evening (Lighthouse month calendar): every day cell always shows all 5 activity rows (icon only when empty, count when people signed up, green when you're in) — empty days no longer look blank. Every cell is tappable, including the dimmed out-of-month days: tapping one jumps to that month and opens its day popup (openDay sets the month from the tapped day).
  Fifth round same evening (Scheduler): More menu has a Scheduler tab (Manager/Conductor only) and the conductor editor moved out of Settings into it. Conducting is per DAY, not per week: Scheduler shows a week list — tap a week, then a day Mon–Sun, then the person conducting that day (one conductor per day; Clear conductor removes them). The list always runs through one blank week ahead of the last week with anyone set — set someone in the blank week and the next week opens up after it. No version bump (same k+"_conductor" keys).
  Sixth round same evening: "leader" is now "conductor" everywhere (role, day's person, data keys — migrate() is at v5 and renames k+"_leader" keys and "leader" roles). Codes: congregation codes are 12 letters/numbers, publisher codes 9 (generated, no confusing 0/O/1/I/L). Front menu: Join a congregation / Set up a congregation (first-time login). New joiners and the elder setting up get a first-time profile step (name, phone, photo). Logo redone — polished white briefcase with gold clasp on emerald green.
  Photo fix same evening: the photo pickers were buttons that JS-clicked a hidden file input, which does nothing in some phone browsers — now the pickers are <label>s tied to the file input, so tapping the label opens the gallery directly. My Schedule also shows an "Add your photo" card at the top until you have a photo, so you don't have to log out or hunt in Profile. pickPhoto now keeps your real role (it used to write "publisher" when the stored record had no role, which demoted the demo manager).
  Nov 25 (codes are elders-only): the profile-step codes box now shows only for the elder setting up a congregation — publishers (including the demo account) go straight to the profile step and do their photo/name/phone. The elder creates each publisher's account in Settings and hands them the congregation + publisher codes in person; after adding one, Settings shows both codes with small Copy buttons. Copy buttons in the code boxes are small now — they were inheriting the full-width button style and overflowing the card.

let congCache = {};       // latest congregation document data ({} while loading)
let congLoaded = false;   // true once the first snapshot has arrived
let congUnsub = null;     // onSnapshot unsubscribe for the current congregation
function congRef(code){ return db.collection("congregations").doc(code || state.cong); }
function load(){ return congCache || {}; }
function save(data){
  congCache = data;
  if (!state.cong || !db) return;
  congRef().set(data, {merge:true}).catch(e=>{ console.error("save failed", e); });
}
function attachListener(){
  if (congUnsub) { congUnsub(); congUnsub = null; }
  congLoaded = false;
  if (!state.cong || !db) return;
  congUnsub = congRef().onSnapshot(snap=>{
    if (snap.exists) {
      const data = snap.data() || {};
      if (!data._v) data._v = 6;
      congCache = data;
    } else {
      congCache = {};
    }
    congLoaded = true;
    const d = congCache;
    // Only re-render once the user is past the first-profile step, so a
    // live update never wipes a profile form someone is filling in.
    if (state.me && d._welcomed && d._welcomed[state.me]) render();
  }, err=>{ console.error("listen failed", err); });
}
function detachListener(){
  if (congUnsub) { congUnsub(); congUnsub = null; }
}

  let data = null;
  if (cong === DEMO.congCode) {
    data = await ensureDemoSeeded();
  } else {
    const snap = await congRef(cong).get().catch(()=>null);
    if (!snap || !snap.exists) return renderJoin("That congregation code isn't recognized in this demo. Try DEMO — or set up a new congregation from the front menu.");

  state.cong = cong;
  if (!data._v) data._v = 6;

function pickFirstPhoto(input){
  const f = input.files && input.files[0]; if(!f) return;
  const img = new Image();
  img.onload = ()=>{
    const s = 128;
    const c = document.createElement("canvas"); c.width = s; c.height = s;
    const ctx = c.getContext("2d");
    const side = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, s, s);
    state.firstPhoto = c.toDataURL("image/jpeg", 0.85);
    URL.revokeObjectURL(img.src);
    renderFirstProfile();
  };
  img.src = URL.createObjectURL(f);
}

function sendChat(k, tag){
  const text = (state.chatDraft[tag]||"").trim();
  if (!text) return;
  // Atomic append: two people chatting at once must not clobber each other,
  // so the message goes up with arrayUnion, not a whole-document save.
  const msg = {who: state.me, text, at: Date.now()};
  const d = load();
  d[k+"_chat"] = d[k+"_chat"]||[];
  d[k+"_chat"].push(msg);
  state.chatDraft[tag] = "";
  state.mentionFor = null;
  if (db) congRef().update({[k+"_chat"]: firebase.firestore.FieldValue.arrayUnion(msg)}).catch(e=>{ console.error("chat send failed", e); });

  });

function copyPhone(phone){
  const done = ()=>{ state.copied = true; render(); setTimeout(()=>{ state.copied = false; render(); }, 1500); };

function pickPhoto(input){
  const f = input.files && input.files[0]; if(!f) return;
  const img = new Image();
  img.onload = ()=>{
    const s = 128;
    const c = document.createElement("canvas"); c.width = s; c.height = s;
    const ctx = c.getContext("2d");
    const side = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, s, s);
    const url = c.toDataURL("image/jpeg", 0.85);
    const d = load();
    d._people = d._people || {};
    const cur = (d._people[state.me] || people()[state.me] || {});
    d._people[state.me] = {first: cur.first||"", last: cur.last||"", phone: cur.phone||"", role: personRole(state.me), photo: url};
    save(d); render();
  };
  img.src = URL.createObjectURL(f);
}

function mark(a){
  const data = load(); const k = state.selDay || dayKey(new Date());
  data[k] = data[k]||{};
  if (!a) { delete data[k][state.me]; }
  else {
    const cur = arr(data[k][state.me]);
    const i = cur.indexOf(a);
    if (i>=0) cur.splice(i,1); else cur.push(a);
    if (cur.length) data[k][state.me] = cur; else delete data[k][state.me];
  }
  save(data); render();

function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const dow = (x.getDay()+6)%7; x.setDate(x.getDate()-dow); return x; }
function weekLabel(monK){
  const mon = parseKey(monK);
  const sun = new Date(mon); sun.setDate(sun.getDate()+6);
  const f = d=>d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  return f(mon) + " – " + f(sun);
}
function weekSetCount(monK){
  const mon = parseKey(monK);
  let n = 0;
  for (let i=0;i<7;i++){ const d = new Date(mon); d.setDate(d.getDate()+i); if ((load()[dayKey(d)+"_conductor"]||"")) n++; }
  return n;
}
function schedWeeks(){
  const data = load();
  const cur = mondayOf(new Date());
  let last = cur;
  Object.keys(data).forEach(k=>{
    if (!k.endsWith("_conductor")) return;
    if (!data[k]) return;
    const m = mondayOf(parseKey(k.slice(0,10)));
    if (m > last) last = m;
  });
  const weeks = [];
  let w = new Date(cur);
  const end = new Date(last); end.setDate(end.getDate()+7);
  while (w <= end){ weeks.push(dayKey(w)); w = new Date(w); w.setDate(w.getDate()+7); }
  return weeks;
}
function openSchedWeek(monK){ state.schedWeek = monK; state.schedDay = null; render(); }
function openSchedDay(k){ state.schedDay = k; render(); }
function backToWeeks(){ state.schedWeek = null; state.schedDay = null; render(); }

function clearConductor(){
  const d = load();
  const key = state.schedDay+"_conductor";
  delete d[key];
  state.schedDay = null;
  // A whole-document save with merge:true would not delete the field on the
  // server, so clear it atomically instead.
  if (db) congRef().update({[key]: firebase.firestore.FieldValue.delete()}).catch(e=>{ console.error("clear conductor failed", e); });
  render();
}

  }

      const n = weekSetCount(monK);
      const isCur = monK === dayKey(mondayOf(new Date()));
      return `<div class="person schedweek" onclick="openSchedWeek('${monK}')">

    }).join("")}

  save(data); render();
}
function deleteCongCard(){
  if (state.cong==="DEMO") return `<div class="card"><div class="secthead">Delete congregation</div><p class="sub">The demo congregation can't be deleted.</p></div>`;
  if (state.confirmDeleteCong) return `<div class="card"><div class="secthead">Delete congregation</div><p class="sub"><b>Are you sure?</b> This permanently deletes ${esc(congName())} — everyone, every sign-up and every chat — for everyone. This can't be undone.</p><div style="display:flex;gap:8px"><button style="flex:1;background:#b3261e" onclick="deleteCongregation()">Yes, delete it</button><button class="ghost" style="flex:1" onclick="state.confirmDeleteCong=false;state.deleteCongErr='';render();">Cancel</button></div>${state.deleteCongErr?`<div class="err">${esc(state.deleteCongErr)}</div>`:``}</div>`;
  return `<div class="card"><div class="secthead">Delete congregation</div><p class="sub">This permanently deletes the whole congregation — everyone, every sign-up and every chat — for everyone. This can't be undone.</p><button style="background:#b3261e" onclick="state.confirmDeleteCong=true;render();">Delete this congregation</button></div>`;
}
function removePublisher(code, btn){
  if (!canManage() || code===state.me) return;
  if (!btn.dataset.armed){ btn.dataset.armed="1"; btn.textContent="Tap again to confirm"; setTimeout(()=>{ if (btn.isConnected){ delete btn.dataset.armed; btn.textContent="Remove"; } }, 5000); return; }
  const d = load();
  const nm = personName(code);
  const fv = (typeof firebase!=="undefined" && firebase.firestore) ? firebase.firestore.FieldValue : null;
  const updates = {};
  ["_people","_roles","_territory","_welcomed"].forEach(f=>{ if (d[f] && d[f][code]!==undefined && fv) updates[f+"."+code]=fv.delete(); });
  Object.keys(d).forEach(k=>{
    if (/^\d{4}-\d{2}-\d{2}$/.test(k) && d[k] && d[k][code]) { delete d[k][code]; updates[k]=d[k]; }
    if (k.endsWith("_conductor") && d[k]===nm) { delete d[k]; if (fv) updates[k]=fv.delete(); }
  });
  if (d._people) delete d._people[code];
  if (d._roles) delete d._roles[code];
  if (d._territory) delete d._territory[code];
  if (d._welcomed) delete d._welcomed[code];
  if (db && Object.keys(updates).length) congRef().update(updates).catch(e=>{ console.error("remove publisher failed", e); });
  render();
}
async function deleteCongregation(){
  if (!canManage() || state.cong==="DEMO" || !db) return;
  detachListener();
  try { await congRef().delete(); }
  catch(e){ console.error("delete congregation failed", e); state.deleteCongErr="Couldn't delete it — check your connection and try again."; state.confirmDeleteCong=false; attachListener(); render(); return; }
  logout();
}
function genPubCode(){ document.getElementById("np-code").value = genCode(9); }
function addPublisher(){
  const name = document.getElementById("np-name").value.trim();
  const code = document.getElementById("np-code").value.trim().toUpperCase();
  const phone = document.getElementById("np-phone").value.trim();
  const err = document.getElementById("np-err");
  if (!name || !code) { err.textContent = "Name and publisher code are needed."; return; }
  if (!/^[A-Z0-9]{9}$/.test(code)) { err.textContent = "Publisher codes are 9 letters and numbers — tap Generate."; return; }
  if (people()[code]) { err.textContent = "That publisher code is already in use."; return; }
  const parts = name.split(/\s+/);
  const d = load();
  d._people = d._people || {};
  d._people[code] = {first:parts[0], last:parts.slice(1).join(" ")||"", role:"publisher", phone:phone};
  save(d);
  state.addedPub = {name:name, code:code};
  render();
}
function saveTerritory(){
  const data = load(); data._territory = data._territory || {};
  document.querySelectorAll("[data-terr]").forEach(cb=>{ data._territory[cb.dataset.terr]=cb.checked; });
  save(data);
}
function rotateCode(){
  const code = genCode(12);
  document.getElementById("rotated").innerHTML = `<p style="margin-top:10px"><b>New congregation code: ${code}</b><br><span class="sub">In the real app the old code stops working everywhere. This demo keeps using DEMO.</span></p>`;
}
function helpHTML(){
  return `
  <div class="pagetitle">Help</div>
  <div class="card">
    <div class="secthead">Signing up</div>
    <p class="sub">Tap a day on My Schedule to see the day and join in, or open Daily. Pick what you'll be doing — Door to door, Letters, Calls/Returns, Study, or Carts — and pick more than one if you're doing several things that day. Tap one again to take it off, or "I'm not going" to take yourself off.</p>
    <div class="secthead">Day chat</div>
    <p class="sub">Every day has its own chat. Tap @ to mention a friend and make plans — tap a mention to see their contact card.</p>
    <div class="secthead">How far ahead</div>
    <p class="sub">Days open up as soon as a conductor is set for them. Past days drop off at midnight, and today is always highlighted.</p>
    <div class="secthead">Contacting friends</div>
    <p class="sub">Tap any name to see their photo and phone, then Call, Text, or Copy phone. No email — just tap and talk.</p>
    <div class="secthead">Your codes</div>
    <p class="sub">You sign in with a congregation code and your publisher code — no email, no password. The elder hands both codes out in person. Once you're signed in, you stay signed in on this device.</p>
    <div class="secthead">For the elder</div>
    <p class="sub">One elder sets up the congregation and manages roles from Settings. Conductors set the day's conductor in the Scheduler (More menu) and who has territory in Settings. If a code leaks, rotate it in Settings and hand the new one out in person.</p>
    <div class="secthead">About this app</div>
    <p class="sub">Everything is stored in your congregation's shared, synced database — sign-ups, conductors and chats update live on everyone's phones.</p>
  </div>`;
}
function render(){
  const app = document.getElementById("app");
  if (!state.cong) { renderLogin(""); return; }
  const y = (typeof window !== "undefined" && window.scrollY) || 0;
  const viewChanged = state._lastView !== state.view;
  app.className = "hasnav";
  let body = "";
  if (state.view==="schedule") body = scheduleHTML();
  else if (state.view==="daily") body = dailyHTML();
  else if (state.view==="more") body = moreHTML();
  else if (state.view==="profile") body = profileHTML();
  else if (state.view==="settings") body = settingsHTML();
  else if (state.view==="scheduler") body = schedulerHTML();
  else if (state.view==="help") body = helpHTML();
  app.innerHTML = topbarHTML() + '<div class="view' + (viewChanged ? ' anim' : '') + '">' + body + '</div>' + bottomnavHTML() + (state.dayPopup ? dayPopupHTML(state.dayPopup) : "") + (state.popup ? popupHTML(state.popup) : "");
  state._lastView = state.view;
  if (typeof window !== "undefined" && window.scrollTo) window.scrollTo(0, viewChanged ? 0 : y);
}
(async function boot(){
  document.getElementById("favicon").href = ICON;
  const app = document.getElementById("app");
  if (!db || !auth) {
    app.innerHTML = `<div class="loginbrand"><img src="${ICON}" alt="Ministry Planner"><h1>Ministry Planner</h1><p class="sub">Couldn't reach the sync service. Check your connection and reload.</p></div>`;
    return;
  }
  app.innerHTML = `<div class="loginbrand"><img src="${ICON}" alt="Ministry Planner"><h1>Ministry Planner</h1><p class="sub">Connecting…</p></div>`;
  try { await auth.signInAnonymously(); }
  catch(e){
    app.innerHTML = `<div class="loginbrand"><img src="${ICON}" alt="Ministry Planner"><h1>Ministry Planner</h1><p class="sub">Couldn't sign in to the sync service. Check your connection and reload.</p></div>`;
    return;
  }
  const s = getSession();
  if (s && s.cong && s.me) {
    state.cong = s.cong; state.me = s.me;
    const snap = await congRef().get().catch(()=>null);
    const data = (snap && snap.exists) ? (snap.data()||{}) : {};
    if (!data._v) data._v = 6;
    congCache = data; congLoaded = true;
    attachListener();
    const p = (data._people||{})[s.me];
    if (p) { render(); return; }
    detachListener();
    clearSession();
    state.cong = null; state.me = null;
  }
  renderLogin("");
})();
</script>
